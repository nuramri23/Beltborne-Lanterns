plugins {
    id 'net.fabricmc.fabric-loom'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
    id 'java-library'
}

group = "${rootProject.maven_group}.fabric"

// Determine MC target (default: 26.1.x, pass -Pmc_target=26.2 for 26.2 build)
def mcTarget = project.findProperty("mc_target") ?: "26.1"
def is262 = mcTarget == "26.2"

def activeMcVersion         = is262 ? rootProject.minecraft_version_262         : rootProject.minecraft_version
def activeFabricLoader      = is262 ? rootProject.fabric_loader_version_262      : rootProject.fabric_loader_version
def activeFabricApi         = is262 ? rootProject.fabric_api_version_262         : rootProject.fabric_api_version
def activeClothConfig       = is262 ? rootProject.cloth_config_version_262       : rootProject.cloth_config_version
def activeModMenu           = is262 ? rootProject.modmenu_version_262            : rootProject.modmenu_version
def activeLambDynLights     = is262 ? rootProject.lambdynamiclights_version_262  : rootProject.lambdynamiclights_version
def activeJarSuffix         = is262 ? "26.2" : "26.1.x"

logger.lifecycle("Building for MC ${activeMcVersion} (target: ${mcTarget})")

base {
    archivesName = "${rootProject.archives_name}-fabric"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs += rootProject.file("modules/common/src/main/java")
        }
        resources {
            srcDirs += rootProject.file("modules/common/src/main/resources")
            srcDirs += file("src/main/generated")
        }
    }
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.gegy.dev' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}


loom {
    mixin {
        defaultRefmapName = "beltborne_lanterns-fabric.refmap.json"
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run/server")
        }
    }
}

fabricApi {
    configureDataGeneration()
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

dependencies {
    minecraft "com.mojang:minecraft:${activeMcVersion}"
    implementation "net.fabricmc:fabric-loader:${activeFabricLoader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${activeFabricApi}"
    compileOnly "org.spongepowered:mixin:0.8.7"
    
    // Re-enabled optional dependencies
    implementation "me.shedaniel.cloth:cloth-config-fabric:${activeClothConfig}"
    compileOnly "com.terraformersmc:modmenu:${activeModMenu}"
    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${activeLambDynLights}"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def props = [
        version: project.version,
        mod_id: rootProject.findProperty('mod_id'),
        mod_name: rootProject.findProperty('mod_name'),
        mod_description: rootProject.findProperty('mod_description'),
        mod_authors: rootProject.findProperty('mod_authors'),
        mod_homepage: rootProject.findProperty('mod_homepage'),
        mod_sources: rootProject.findProperty('mod_sources'),
        mod_license: rootProject.findProperty('mod_license'),
        minecraft_version: activeMcVersion,
        fabric_loader_version: activeFabricLoader,
        cloth_config_version: activeClothConfig,
        modmenu_version: activeModMenu,
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand(props) }
}

jar {
    archiveFileName.set("${rootProject.archives_name}-${project.version}-fabric+${activeJarSuffix}.jar")
}

// =========== Modrinth =========
def modrinth_token = rootProject.ext.resolveModrinthToken()
if (!modrinth_token) {
    logger.warn("WARNING: MODRINTH_TOKEN not found. Publishing to Modrinth will be skipped.")
    modrinth_token = "dummy_token_publishing_disabled"
}

modrinth {
    token = modrinth_token
    projectId = "NUFDZAKS"
    versionNumber = "${project.version}-fabric"
    versionName   = "Beltborne Lanterns v${project.version}+${rootProject.minecraft_version} [Fabric/Quilt]"
    versionType   = "release"
    gameVersions  = [ rootProject.minecraft_version ]
    loaders       = [ "fabric","quilt" ]
    uploadFile    = jar
    changelog     = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : ""
    dependencies { required.project "cloth-config" }
}

// ====================== CurseForge ====================
def curse_token = rootProject.ext.resolveCurseforgeToken()
if (!curse_token) {
    logger.warn("WARNING: CURSEFORGE_TOKEN not found. Publishing to CurseForge will be skipped.")
    curse_token = "dummy_token_publishing_disabled"
}

def curse_project_id =
        (findProperty("curseforge_project_fabric")
                ?: System.getenv("CURSEFORGE_PROJECT_FABRIC")
                ?: findProperty("curseforge_project")
                ?: System.getenv("CURSEFORGE_PROJECT_ID")
                ?: "1337474")

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = curse_token
    disableVersionDetection()
    dependsOn jar
    def mainFile = upload(curse_project_id as String, jar)
    mainFile.displayName = "Beltborne Lanterns v${project.version}+${rootProject.minecraft_version} [Fabric/Quilt]"
    mainFile.releaseType = "release"
    mainFile.addModLoader("Fabric")
    mainFile.addModLoader("Quilt")
    mainFile.addGameVersion("${rootProject.minecraft_version}")
    mainFile.addJavaVersion("Java 25")
    mainFile.addEnvironment("Client", "Server")
    mainFile.changelog = rootProject.file("CHANGELOG.md"); mainFile.changelogType = "markdown"
    mainFile.addRequirement("cloth-config")
}
