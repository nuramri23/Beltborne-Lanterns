plugins {
    id 'multiloader-common'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    // Mixin compile-only
    compileOnly "org.spongepowered:mixin:0.8.7"

    // Cloth Config API (compile-only in common, using Fabric variant)
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    // LambDynamicLights API (compile-only)
    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${rootProject.lambdynamiclights_version}"
}
