# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties
mod_version = 1.2.7
maven_group = net.oxcodsnet.beltborne_lanterns
archives_name = beltborne_lanterns

# ===============================================
# Minecraft properties
# To build for MC 26.2: .\gradlew :modules:fabric:build -Pmc_target=26.2
# To build for MC 26.1.x (default): .\gradlew :modules:fabric:build

minecraft_version = 26.1
neoform_version = 1.21.10-20251010.172816

# MC 26.1.x dependencies (default)
fabric_loader_version = 0.18.4
fabric_api_version = 0.155.2+26.1.2
cloth_config_version=26.1.154
modmenu_version=18.0.0-alpha.8
lambdynamiclights_version=4.10.0+26.1

# MC 26.2 dependencies (used when -Pmc_target=26.2)
fabric_loader_version_262 = 0.19.3
fabric_api_version_262 = 0.157.0+26.2
cloth_config_version_262 = 26.2.155
modmenu_version_262 = 20.0.1
lambdynamiclights_version_262 = 4.12.3+26.2
minecraft_version_262 = 26.2

neoforge_version = 21.10.47-beta

# ===============================================
mod_id=beltborne_lanterns
mod_name=Beltborne Lanterns
mod_description=Beltborne Lanterns - free hands, bright path!\n\nPress *B* while holding a lantern - it snaps onto your belt. Walk, jump, fight - the lantern sways with physics and casts light near you. Need it back in your hands - Press *B* again.\n\nPorted to MC 26.x by nuramri23.
mod_authors=0xCoDSnet, nuramri23
mod_homepage=https://modrinth.com/mod/beltborne-lanterns-unofficial-mc-26.1-port
